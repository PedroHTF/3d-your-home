<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>3D Your Home — visualizador</title>
  </head>
  <body>
    <header id="bar">
      <strong class="brand">3D Your Home</strong>
      <select id="source" aria-label="Levantamento ou edificação"></select>
      <div class="seg" role="group" aria-label="Vista">
        <button id="v3d" class="on">3D</button>
        <button id="vplan">Planta</button>
      </div>
      <button id="layersBtn" aria-expanded="false">Camadas</button>
    </header>
    <main id="stage">
      <canvas id="c"></canvas>
      <div id="labels"></div>
      <div id="status" role="status"></div>
      <section id="layers" hidden>
        <h2>Camadas</h2>
        <label><input type="checkbox" data-layer="wall" checked /> Paredes</label>
        <label><input type="checkbox" data-layer="door" checked /> Portas</label>
        <label><input type="checkbox" data-layer="window" checked /> Janelas</label>
        <label><input type="checkbox" data-layer="floor" checked /> Piso</label>
        <label><input type="checkbox" data-layer="ceiling" /> Teto</label>
        <label><input type="checkbox" data-layer="space" checked /> Cômodos</label>
        <label><input type="checkbox" data-layer="points" /> Nuvem de pontos</label>
        <label><input type="checkbox" data-layer="markers" checked /> Marcadores</label>
        <hr />
        <label><input type="checkbox" id="origin" checked /> Destacar o que é inferido</label>
        <label class="range">Corte em altura <span id="cutv">—</span>
          <input type="range" id="cut" min="0" max="1" step="0.01" value="1" /></label>
      </section>
      <aside id="props" hidden>
        <button id="closeProps" aria-label="Fechar">×</button>
        <div id="propsBody"></div>
      </aside>
      <footer id="legend">
        <span><i class="sw measured"></i>medida</span>
        <span><i class="sw inferred"></i>inferida</span>
        <span><i class="sw user"></i>usuário</span>
        <span id="scaleInfo"></span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
