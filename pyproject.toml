[project]
name = "tdyh"
version = "0.1.0"
description = "3D Your Home: fotos/vídeos -> modelo 3D, planta, CAD paramétrico e IFC"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "celery>=5.3",
  "redis>=5",
]

[project.optional-dependencies]
recon = ["pycolmap>=3.10", "open3d>=0.18"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tdyh = "tdyh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
