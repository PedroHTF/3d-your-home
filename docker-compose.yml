services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment:
      TDYH_DATA: /data
      TDYH_USE_CELERY: "1"
      TDYH_REDIS_URL: redis://redis:6379/0
    volumes: ["./data:/data"]
    ports: ["8000:8000"]
    depends_on: [redis]

  worker-gpu:
    build: { context: ., dockerfile: infra/Dockerfile.gpu }
    environment:
      TDYH_REDIS_URL: redis://redis:6379/0
    volumes: ["./data:/data"]
    depends_on: [redis]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
